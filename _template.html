<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- ═══════════════════════════════════════════════════════════
     PAEDIATRIC ANAESTHESIA — PAGE TEMPLATE
     ───────────────────────────────────────────────────────────
     To make a new page:
       1. Copy this file → mepa-<yourpage>.html
       2. Set <title>, <body data-page="..."> (a unique id) and
          the title/tag passed to MEPA.init()
       3. Add the page to NAV_PAGES in assets/site.js
          (id must match data-page; href must match the filename)
       4. Fill in ALGOS() below with your content
       5. Open it in a browser (or push to GitHub Pages)

     Shared files:
       assets/growth-uk-who.js  UK-WHO BMI LMS tables
       assets/calc.js     patient state, estimateWeight(), bodySize()
                          (BMI centile, IBW, AdjBW, LBW), dosingWeight(),
                          D(perKg, unit, {max, hi, basis, label…}) → live dose chip
       assets/drugs.js    EMERG + GROUPS drug data, renderDrugTable(),
                          renderEmergTable(), renderSoba(), renderEttRef()
       assets/emergencies.js  the crisis algorithms (ALGOS)
       assets/site.js     navbar + theme picker, patient bar, selector,
                          search, accordion, print-clean PDF, NTS/NAP4
       assets/theme.js    applies the saved theme before first paint
     ═══════════════════════════════════════════════════════════ -->
<title>New Page — Paediatric Anaesthesia</title>
<script src="assets/theme.js"></script>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body data-page="template">

<!-- navbar and patient bar are injected by site.js -->
<div class="patientbar" id="patientbar"></div>

<div class="wrap">
  <aside class="selector">
    <h2>Select</h2>
    <div id="selectorList"></div>
  </aside>
  <main class="content" id="content"></main>
</div>

<div class="footer">
  <span><b>Paediatric Anaesthesia</b> · Guidelines: APA · DAS · AAGBI · RCUK · RXH Local Protocols</span>
  <span>Live tool — always <b>verify against the SAMF</b> and your local formulary.</span>
</div>

<script src="assets/growth-uk-who.js"></script>
<script src="assets/calc.js"></script>
<script src="assets/drugs.js"></script>
<script src="assets/site.js"></script>
<script>
/* ============================================================
   PAGE DATA — capitalise titles, pills and labels in Title Case;
   step text stays in sentence case.
   ============================================================ */
function ALGOS(){ return [

  /* a step-list item (dose chips calculate live; basis = SOBA dosing weight) */
  {id:'example', group:'Airway / Respiratory', c:'air', title:'Example Emergency', pill:'Airway',
   steps:[
     `<b>Call for help</b>; 100% O₂.`,
     `Give Propofol ${D(1,'mg',{hi:2,basis:'IBW'})} IV.`,
   ],
   flag:`One-line safety reminder.`},

  /* a custom HTML item */
  {id:'emergdrugs', group:'Reference', c:'acc', title:'All Emergency Drugs (Live Table)', pill:'Reference',
   type:'custom', html:()=>renderEmergTable()},

]; }

MEPA.init({
  title: 'New Page Title',
  tag: 'Doses Live-calculated from Weight',
  algos: ALGOS,
  searchPlaceholder: 'Search'
});
</script>
</body>
</html>
