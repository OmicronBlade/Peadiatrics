<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drug Reference — Paediatric Anaesthesia</title>
<script src="assets/theme.js"></script>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body data-page="drugs">

<!-- navbar and patient bar are injected by site.js -->
<div class="patientbar" id="patientbar"></div>

<div class="wrap">
  <aside class="selector">
    <h2>Sections</h2>
    <div id="selectorList"></div>
  </aside>
  <main class="content" id="content"></main>
</div>

<div class="footer">
  <span><b>Paediatric Anaesthesia</b> · Guidelines: APA · DAS · AAGBI · RCUK · RXH Local Protocols · SAMF</span>
  <span>Live tool — always <b>verify against the SAMF</b> and your local formulary. Doses shown with working; check every number.</span>
</div>

<script src="assets/growth-uk-who.js"></script>
<script src="assets/calc.js"></script>
<script src="assets/drugs.js"></script>
<script src="assets/site.js"></script>
<script>
/* Drug data and renderers live in assets/drugs.js (shared by every page). */
function renderGroup(g){
  const unv = g.drugs.some(d=>d.unv);
  return (g.note?`<span class="flag">${g.note}</span>`:'')
    + renderDrugTable(g.drugs,{doseHead:'Dose', notesHead:'Notes / Timing'})
    + (g.extra?g.extra():'')
    + `<p class="hint">Sources: RXH Paediatric Anaesthesia Quick Reference Guide (2023 v3) and paedspro.com (badged <span class="ppb">paedspro</span>)${unv?'; <span class="unv">UNVERIFIED</span> = in neither':''}. Tags such as <span class="basis">IBW</span> show the SOBA dosing weight; they switch from TBW when the BMI centile is ≥98th (enter height and sex). Always verify against the SAMF.</p>`;
}

function ALGOS(){
  return GROUPS.map(g=>({id:g.id, group:'Drug Groups', c:g.c, title:g.title, pill:g.pill,
      type:'custom', html:()=>renderGroup(g), drugs:g.drugs}))
  .concat([
    {id:'soba', group:'Reference', c:'acc', title:'Obesity & Dosing Weights (SOBA)', pill:'Reference',
     type:'custom', html:()=>renderSoba()},
    {id:'alldrugs', group:'Reference', c:'acc', title:'All Emergency Drugs (Live Table)', pill:'Reference',
     type:'custom', html:()=>renderEmergTable(), drugs:EMERG},
    {id:'ett', group:'Reference', c:'acc', title:'ETT · Vitals · Cardioversion', pill:'Reference',
     type:'custom', html:()=>renderEttRef()},
  ]);
}

MEPA.init({
  title: 'Drug Reference',
  tag: 'Every Dose Live for the Entered Weight',
  algos: ALGOS,
  ntsGroups: [],          // a drug reference doesn't need NTS/NAP4 blocks
  nap4Groups: [],
  autoOpenFirst: false,
  groupOrder: ['Drug Groups','Reference'],
  searchPlaceholder: 'Search All Drugs',
  searchText: a => (a.drugs||[]).map(d=>d.name+' '+(d.note||'')).join(' '),
  searchResults: q => {
    const hits = allDrugs().filter(d=>drugMatches(d,q));
    return hits.length ? renderDrugTable(hits,{doseHead:'Dose', notesHead:'Notes / Timing', groupCol:true})
                       : '<p class="hint">No drugs match.</p>';
  },
  emptyTitle: 'Drug Reference',
  emptyBody: 'Pick a drug group or search above. Doses are calculated live for the entered weight.'
});
</script>
</body>
</html>
